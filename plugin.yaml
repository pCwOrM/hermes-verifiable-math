name: verifiable-math-kernel
version: "1.0.5"
description: >-
  Deterministic symbolic computation, integer factorization with Baillie-PSW
  probable-prime testing, elliptic curve invariant analysis, and formal Lean 4
  proof auditing for Hermes Agent. When enabled, lean4_proof_audit can
  optionally validate proof syntax via local `lean --stdin` with per-call
  approval and minimal environment.
author: "Volkan Dagli"
maintainer: pCwOrM
tier: community
category: tools
license: "MIT"
homepage: "https://github.com/pCwOrM/hermes-verifiable-math"
requires_hermes: ">=0.21.0"
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - verify_math_claim
  - certified_factorization
  - elliptic_curve_analyzer
  - lean4_proof_audit
provides_hooks:
  - pre_tool_call
  - post_tool_call
requires_env: []
config_schema:
  enable_lean_cli:
    type: bool
    default: false
    label: "Enable Local Lean 4 CLI Check"
    description: "When true and `lean` is found on PATH, lean4_proof_audit can invoke `lean --stdin` with user approval, minimal environment, and isolated scratch directory."
    required: false
