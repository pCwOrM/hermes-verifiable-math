[project]
name = "hermes-verifiable-math"
version = "1.0.3"
description = "Deterministic symbolic computation, integer factorization with Baillie-PSW probable-prime testing, elliptic curve invariant analysis, and formal Lean 4 proof auditing for Hermes Agent."
readme = "README.md"
authors = [{ name = "Volkan Dagli" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12,<2",
    "mpmath>=1.3,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Security :: Cryptography",
]
keywords = [
    "hermes-agent",
    "hermes-agent-plugin",
    "nousresearch",
    "mathematical-reasoning",
    "formal-verification",
    "lean4",
    "symbolic-computation",
    "zero-hallucination",
    "elliptic-curves",
    "integer-factorization",
    "baillie-psw",
    "proof-certificates",
    "sympy",
]

[project.urls]
Homepage = "https://github.com/pCwOrM/hermes-verifiable-math"
Documentation = "https://github.com/pCwOrM/hermes-verifiable-math#readme"
"Hermes Agent" = "https://hermes-agent.nousresearch.com"
"arXiv Preprint (Collatz Lean 4)" = "https://arxiv.org/abs/2611.11641"
"CERN Zenodo Archive" = "https://doi.org/10.5281/zenodo.24060394"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".git", ".pytest_cache", "__pycache__"]
addopts = "--ignore=__init__.py"
