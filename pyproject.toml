[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-verifiable-math"
version = "1.0.0"
description = "Deterministic symbolic computation, certified integer factorization, elliptic curve invariant analysis, and formal Lean 4 proof verification for Hermes Agent."
readme = "README.md"
authors = [{ name = "Volkan Dağlı (pCwOrM)", email = "pcworm@pcworm.net" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
